services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8060:8080"
    volumes:
      - ./src:/app
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=delivery_writer
      - DB_PASSWORD=writer_password
      - DB_NAME=delivery
      - DB_READER_HOST=host.docker.internal
      - DB_READER_PORT=5432
      - DB_READER_USER=delivery_reader
      - DB_READER_PASSWORD=reader_password
      - DB_READER_NAME=delivery
      - VERSION=0.1.0
      - LOG_LEVEL=debug
      - PULSAR_URL=pulsar://host.docker.internal:6650
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
    command: ["sleep", "infinity"]      

